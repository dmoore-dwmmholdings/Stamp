name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the installer to"
        required: true

permissions:
  contents: write

jobs:
  # What the installers are about to be named after.  A manual run builds main
  # and attaches the result to a tag somebody typed, so nothing otherwise makes
  # the two agree: the manifest would say one version over the bytes of another,
  # which is the one thing a signed feed must never do.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - name: Check the tag against the version being built
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          want="${tag#v}"
          source_version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/stamp/__init__.py)
          installer_version=$(sed -n 's/^#define AppVersion "\(.*\)"/\1/p' packaging/stamp.iss)
          echo "tag $tag, source $source_version, installer $installer_version"
          if [ "$source_version" != "$want" ] || [ "$installer_version" != "$want" ]; then
            echo "::error::$tag would ship Stamp $source_version (installer $installer_version). Bump src/stamp/__init__.py and packaging/stamp.iss, or run this over the matching tag."
            exit 1
          fi
      - name: Say so when the updater is switched off
        shell: bash
        run: |
          key=$(sed -n 's/^RELEASE_PUBLIC_KEY = "\(.*\)"/\1/p' src/stamp/update.py)
          if [ -z "$key" ]; then
            echo "::warning::RELEASE_PUBLIC_KEY is empty, so this build cannot check a manifest signature and nobody running it will ever be offered an update. See packaging/make_release_key.py."
          fi

  # The installers are what people run.  Shipping one the suite has not passed
  # costs a release; waiting ten minutes costs ten minutes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Qt system libraries and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libglib2.0-0 fonts-dejavu-core
      - run: uv sync --frozen
      - run: uv run pytest

  windows-installer:
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run attaches a rebuilt installer to an existing release;
          # build the current release tooling, not the historical tag that
          # predates it. Published releases still build the tag itself.  The
          # version job has already checked that the two agree.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python packaging/make_icons.py
      - run: uv run pyinstaller packaging/stamp.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Compile the installer
        run: iscc.exe packaging\stamp.iss
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.event.release.tag_name }}" }
          gh release upload $tag (Get-ChildItem packaging\dist\*-Setup.exe).FullName --clobber

  macos-installer:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was the last plain Intel image and GitHub has retired it:
          # the job sat queued forever rather than failing, and the manifest
          # job waits on it, so a release built its installers and then never
          # published the update feed.  macos-15-intel is the Intel runner now.
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # See the Windows job: manual runs rebuild current main and attach to
          # the selected existing release tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python packaging/make_icons.py
      - run: uv run pyinstaller packaging/stamp.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Create macOS installers
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          mkdir -p build/dmg
          ditto build/dist/Stamp.app build/dmg/Stamp.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname "Stamp" -srcfolder build/dmg -ov -format UDZO "build/Stamp-${version}-macos-${{ matrix.arch }}.dmg"
          pkgbuild --identifier com.stamp.app --version "$version" --component build/dist/Stamp.app --install-location /Applications "build/Stamp-${version}-macos-${{ matrix.arch }}.pkg"
      - name: Attach the macOS installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          gh release upload "$tag" build/*-macos-${{ matrix.arch }}.dmg build/*-macos-${{ matrix.arch }}.pkg --clobber

  # The update feed.  Stamp will not read a manifest it cannot verify, so this
  # runs last, over the installers the other jobs have already attached, and
  # signs the result with the key held in the STAMP_RELEASE_KEY secret.
  #
  # No secret, no manifest - and no manifest simply means nobody is offered the
  # update.  That is the safe way round: publishing an unsigned one would be
  # rejected by every client anyway.
  #
  # It needs every installer job to have succeeded, and says nothing if one did
  # not.  Signing over whatever happens to be on the release is how a feed ends
  # up offering the previous run's installer under this run's version.
  manifest:
    needs: [windows-installer, macos-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
      - uses: astral-sh/setup-uv@v5
      - name: Collect the installers from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          mkdir -p assets
          gh release download "$tag" --dir assets \
            --pattern '*-Setup.exe' --pattern '*.dmg'
          ls -l assets
      - name: Write and sign the manifest
        id: sign
        env:
          STAMP_RELEASE_KEY: ${{ secrets.STAMP_RELEASE_KEY }}
        run: |
          if [ -z "$STAMP_RELEASE_KEY" ]; then
            echo "::warning::STAMP_RELEASE_KEY is not set, so no update feed is published and nobody is offered this release automatically. See packaging/make_release_key.py."
            exit 0
          fi
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          uv run --no-project --with cryptography python packaging/make_manifest.py \
            --version "${tag#v}" --tag "$tag" --assets assets \
            --repo "${{ github.repository }}" --output feed
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Attach the feed to the release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          gh release upload "$tag" \
            feed/latest.json feed/latest.json.sig feed/SHA256SUMS --clobber
