name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach the installer to"
        required: true

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python packaging/make_icons.py
      - run: uv run pyinstaller packaging/stamp.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Compile the installer
        run: iscc.exe packaging\stamp.iss
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.event.release.tag_name }}" }
          gh release upload $tag (Get-ChildItem packaging\dist\*-Setup.exe).FullName --clobber

  macos-app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-13
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run python packaging/make_icons.py
      - run: uv run pyinstaller packaging/stamp.spec --noconfirm --distpath build/dist --workpath build/work
      - name: Package the app
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          version="${tag#v}"
          ditto -c -k --sequesterRsrc --keepParent build/dist/Stamp.app "build/Stamp-${version}-macos-${{ matrix.arch }}.zip"
      - name: Attach the macOS app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          gh release upload "$tag" build/*-macos-${{ matrix.arch }}.zip --clobber
